[build]
  publish = "dist"
  command = "npm run build"
  functions = "netlify/functions"

[dev]
  framework = "vite"
  targetPort = 5173
  port = 8888

# =============================================================================
# Auth API Routes — map /api/auth/* to hyphenated function names
# These must appear BEFORE the generic /api/* rule.
# =============================================================================
[[redirects]]
  from = "/api/auth/login"
  to = "/.netlify/functions/auth-login"
  status = 200

[[redirects]]
  from = "/api/auth/register"
  to = "/.netlify/functions/auth-register"
  status = 200

[[redirects]]
  from = "/api/auth/logout"
  to = "/.netlify/functions/auth-logout"
  status = 200

[[redirects]]
  from = "/api/auth/me"
  to = "/.netlify/functions/auth-me"
  status = 200

[[redirects]]
  from = "/api/auth/forgot-password"
  to = "/.netlify/functions/auth-forgot-password"
  status = 200

[[redirects]]
  from = "/api/auth/reset-password"
  to = "/.netlify/functions/auth-reset-password"
  status = 200

[[redirects]]
  from = "/api/auth/create-staff"
  to = "/.netlify/functions/auth-create-staff"
  status = 200

# =============================================================================
# Email Integration (Brevo) API Routes
# =============================================================================
[[redirects]]
  from = "/api/email/status"
  to = "/.netlify/functions/email-settings"
  status = 200

[[redirects]]
  from = "/api/email/test"
  to = "/.netlify/functions/email-settings"
  status = 200

[[redirects]]
  from = "/api/email/*"
  to = "/.netlify/functions/email-settings"
  status = 200

# =============================================================================
# Subscription, Invoice, Discount, Payment & Billing API Routes
# =============================================================================
[[redirects]]
  from = "/api/dashboard/metrics"
  to = "/.netlify/functions/dashboard"
  status = 200

[[redirects]]
  from = "/api/dashboard"
  to = "/.netlify/functions/dashboard"
  status = 200

[[redirects]]
  from = "/api/discounts"
  to = "/.netlify/functions/discounts"
  status = 200

[[redirects]]
  from = "/api/discounts/*"
  to = "/.netlify/functions/discounts"
  status = 200

[[redirects]]
  from = "/api/payments"
  to = "/.netlify/functions/payments"
  status = 200

[[redirects]]
  from = "/api/payments/*"
  to = "/.netlify/functions/payments"
  status = 200

[[redirects]]
  from = "/api/billing/run"
  to = "/.netlify/functions/billing-run"
  status = 200

[[redirects]]
  from = "/api/invoices"
  to = "/.netlify/functions/invoices"
  status = 200

[[redirects]]
  from = "/api/invoices/*"
  to = "/.netlify/functions/invoices"
  status = 200

[[redirects]]
  from = "/api/taxes"
  to = "/.netlify/functions/taxes"
  status = 200

[[redirects]]
  from = "/api/taxes/*"
  to = "/.netlify/functions/taxes"
  status = 200

[[redirects]]
  from = "/api/subscriptions"
  to = "/.netlify/functions/subscriptions"
  status = 200

[[redirects]]
  from = "/api/subscriptions/*"
  to = "/.netlify/functions/subscriptions"
  status = 200

[[redirects]]
  from = "/api/quotation-templates"
  to = "/.netlify/functions/quotation-templates"
  status = 200

[[redirects]]
  from = "/api/quotation-templates/*"
  to = "/.netlify/functions/quotation-templates"
  status = 200

# =============================================================================
# Generic API route — Rewrites /api/* to /.netlify/functions/:splat
# Handles all non-auth endpoints (health, products, plans, customers, etc.)
# =============================================================================
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Client-side SPA routing fallback — MUST be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
